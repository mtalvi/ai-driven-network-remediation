{{/*
Cookie-signing secrets for the oauth-proxy sidecars in front of hub-frontend
and hub-ran-frontend (see global.frontendAuth.enabled in values.yaml and the
shared "hub.oauthProxyContainer" helper in _helpers.tpl). Auto-generated on
first install; the `lookup` preserves the existing value across `helm
upgrade` so upgrades don't invalidate every logged-in session's cookie,
following the same pattern already used for the Gitea admin password in
mcp-secrets.yaml.

Each block's condition mirrors the matching frontend's own top-level gate
(frontend.yaml / ran-frontend.yaml) exactly, so a secret is never created for
a frontend that isn't actually being deployed.
*/}}
{{- if and .Values.global.frontendAuth.enabled .Values.global.networkRemediation.enabled .Values.frontend.enabled }}
{{- $frontendName := printf "%s-frontend" (include "hub.fullname" .) }}
{{- $existingFrontend := lookup "v1" "Secret" .Release.Namespace (printf "%s-oauth" $frontendName) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $frontendName }}-oauth
  labels:
    {{- include "hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
type: Opaque
data:
  {{- if and $existingFrontend $existingFrontend.data (index $existingFrontend.data "cookie-secret") }}
  cookie-secret: {{ index $existingFrontend.data "cookie-secret" }}
  {{- else }}
  cookie-secret: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.global.frontendAuth.enabled .Values.global.telcoOran.enabled .Values.ranFrontend.enabled }}
{{- $ranFrontendName := printf "%s-ran-frontend" (include "hub.fullname" .) }}
{{- $existingRanFrontend := lookup "v1" "Secret" .Release.Namespace (printf "%s-oauth" $ranFrontendName) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $ranFrontendName }}-oauth
  labels:
    {{- include "hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: ran-frontend
type: Opaque
data:
  {{- if and $existingRanFrontend $existingRanFrontend.data (index $existingRanFrontend.data "cookie-secret") }}
  cookie-secret: {{ index $existingRanFrontend.data "cookie-secret" }}
  {{- else }}
  cookie-secret: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
