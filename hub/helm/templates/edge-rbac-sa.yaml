{{- if .Values.edgeRbac.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hub.fullname" . }}-edge-rbac
  labels:
    {{- include "hub.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hub.fullname" . }}-edge-rbac
  labels:
    {{- include "hub.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces", "serviceaccounts", "secrets"]
    verbs: ["create", "get", "list", "update", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["create", "get", "update", "patch", "bind", "escalate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hub.fullname" . }}-edge-rbac
  labels:
    {{- include "hub.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "hub.fullname" . }}-edge-rbac
subjects:
  - kind: ServiceAccount
    name: {{ include "hub.fullname" . }}-edge-rbac
    namespace: {{ .Release.Namespace }}
{{- end }}
